[pytest]
testpaths = tests
addopts = -s --tb=short --strict-markers
markers =
    smoke: quick sanity / smoke tests
    login: authentication-related tests
    discrepancy: discrepancy report feature tests
    discrepancy_smoke: discrepancy smoke tests (minimal set)
    discrepancy_form: form validation and filter tests
    discrepancy_results: results table and pagination tests
    discrepancy_error: error handling and edge cases
    discrepancy_mock: tests using mocked API responses
    discrepancy_e2e: end-to-end tests hitting real API
    admin_navigation: routes, responsive navigation and access control
    admin_mock: all API requests intercepted; authentication is real
    admin_read: dashboard, parcels, health, bags and dispatches
    admin_devices: device configuration and activation workflows
    admin_edges: edge identity, access and configuration publishing
    admin_live: read-only checks against the live admin deployment
